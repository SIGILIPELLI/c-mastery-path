site_name: C Mastery Path
site_description: A structured, module-wise C training program from entry level to master level.
site_url: https://sigilipelli.github.io/c-mastery-path/
repo_url: https://github.com/SIGILIPELLI/c-mastery-path
repo_name: c-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Setup & First Program": level-1/01-setup.md
      - "02 · Variables, Data Types & Operators": level-1/02-variables-data-types.md
      - "03 · Control Flow": level-1/03-control-flow.md
      - "04 · Functions": level-1/04-functions.md
      - "05 · Arrays & Strings": level-1/05-arrays-strings.md
      - "06 · Pointers Basics": level-1/06-pointers-basics.md
      - "07 · Structs": level-1/07-structs.md
      - "08 · File I/O": level-1/08-file-io.md
      - "09 · Preprocessor & Multi-file Compilation": level-1/09-preprocessor-multifile.md
      - "10 · Project — Contact Book": level-1/10-project-contact-book.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Pointers Deep Dive": level-2/01-pointers-deep-dive.md
      - "02 · Dynamic Memory": level-2/02-dynamic-memory.md
      - "03 · Multi-dimensional Arrays & Strings": level-2/03-multidim-arrays-strings.md
      - "04 · Structs & Unions Advanced": level-2/04-structs-unions-advanced.md
      - "05 · Binary File I/O": level-2/05-binary-file-io.md
      - "06 · Error Handling Conventions": level-2/06-error-handling.md
      - "07 · Modular Programming": level-2/07-modular-programming.md
      - "08 · Makefiles & Build Systems": level-2/08-makefiles-build-systems.md
      - "09 · Debugging Tools": level-2/09-debugging-tools.md
      - "10 · Project — Linked-list Inventory System": level-2/10-project-inventory-system.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-3/*.md
  level-4/*.md
